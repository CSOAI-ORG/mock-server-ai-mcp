name: mock-server-ai-mcp
description: Mock Server Ai automation via MCP. Includes create mock endpoint, generate
  mock data, create openapi mock. By MEOK AI Labs.
version: 1.0.0
tools:
- name: create_mock_endpoint
  description: MEOK AI Labs tool.
  parameters:
  - name: method
    type: string
    required: true
  - name: path
    type: string
    required: true
  - name: response_body
    type: string
    required: false
- name: generate_mock_data
  description: MEOK AI Labs tool.
  parameters:
  - name: schema
    type: string
    required: true
  - name: count
    type: integer
    required: false
- name: create_openapi_mock
  description: MEOK AI Labs tool.
  parameters:
  - name: spec
    type: string
    required: true
- name: list_mock_endpoints
  description: MEOK AI Labs tool.
  parameters: []
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
    - apiKey
    properties:
      apiKey:
        type: string
        description: Your MEOK API Key
  commandFunction: "(config) => ({\n  command: 'uvx',\n  args: ['mock-server-ai-mcp',\
    \ '--api-key', config.apiKey],\n  env: {\n    MEOK_API_KEY: config.apiKey\n  }\n\
    })"
